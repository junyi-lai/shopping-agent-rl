# Shopping Agent RLOO configuration (MiniCPM5-2B).
# Same as grpo.yaml except:
#   - adv_estimator=rloo (leave-one-out baseline);
#   - group dynamic sampling disabled (RLOO has no advantage groups);
#   - rollout.n=8, the same as grpo.yaml, so the two algorithms differ only in
#     the advantage estimator.  RLOO's baseline averages the other n-1 samples,
#     so its advantage variance is (n/(n-1))^2 times GRPO's at the same n
#     (4.0x at n=2, 1.31x at n=8): RLOO wants a larger group.
#   - rollout.max_num_seqs=32 >= train_batch_size 2 x n 8, leaving concurrency headroom.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:RL_TRAIN_FILE}
  val_files: ${oc.env:RL_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:RL_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: false
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 3.0e-5
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
  rollout:
    name: vllm
    mode: async
    n: 8                           # 留一法基线:见文件头;与 GRPO 同组大小,只比估计器
    temperature: 1.0
    top_p: 1.0
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.75
    max_num_seqs: 32               # >= train_batch_size 2 x n 8,给并发留余量
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 16
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_AGENT_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: minicpm5
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_AGENT_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: rloo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

shopping_dynamic_sampling:
  enable: false
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_agent.training.rl.compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  total_training_steps: 200
  save_freq: 50
  test_freq: 50
  val_before_train: true
  logger: [console]
  project_name: shopping-agent
  experiment_name: shopping-agent-rloo
  default_local_dir: ${oc.env:RL_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
